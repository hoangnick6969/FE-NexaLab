    <g fill="#7b4bb3" stroke="#4c2a76" stroke-width="1.5">
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(0 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(72 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(144 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(216 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(288 0 -112)"/>
    </g>
    <circle cx="0" cy="-112" r="6" fill="#f2c94c"/>
  </g>
  <g transform="translate(950 300) scale(1.5)">
    <path d="M-34 0 L34 0 L26 46 L-26 46 Z" fill="#b5653b"/>
    <rect x="-38" y="-8" width="76" height="12" rx="4" fill="#8e4b28"/>
    <path d="M0 -8 C -4 -40 6 -70 0 -104" fill="none" stroke="#3f6443" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 -40 C -26 -50 -34 -34 -30 -26 C -18 -26 -8 -32 0 -40 Z" fill="#5d8a4f"/>
    <g fill="#ffffff" stroke="#7a857c" stroke-width="1.5">
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(0 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(72 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(144 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(216 0 -112)"/>
      <ellipse cx="0" cy="-124" rx="9" ry="15" transform="rotate(288 0 -112)"/>
