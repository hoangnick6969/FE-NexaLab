  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect y="560" width="1280" height="160" fill="#b99a72"/>
  <rect y="548" width="1280" height="16" fill="#9c7d58"/>

  <!-- Parent plants P: purple (dominant) and white (recessive) flowers -->
  <g transform="translate(330 300) scale(1.5)">
