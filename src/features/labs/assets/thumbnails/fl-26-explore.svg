  <text x="640" y="250" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="800" fill="#1f6f78">×</text>

  <!-- Punnett 2x2 -->
  <g transform="translate(540 380)">
    <rect x="0" y="0" width="200" height="200" rx="16" fill="#ffffff" stroke="#233c34" stroke-width="4"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#233c34" stroke-width="3"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#233c34" stroke-width="3"/>
    <text x="50" y="62" text-anchor="middle" font-family="monospace" font-size="34" font-weight="800" fill="#14202b">AA</text>
    <text x="150" y="62" text-anchor="middle" font-family="monospace" font-size="34" font-weight="800" fill="#14202b">Aa</text>
    <text x="50" y="162" text-anchor="middle" font-family="monospace" font-size="34" font-weight="800" fill="#14202b">Aa</text>
    <text x="150" y="162" text-anchor="middle" font-family="monospace" font-size="34" font-weight="800" fill="#14202b">aa</text>
  </g>

  <!-- F1 row -->
  <g fill="#7b4bb3">
    <circle cx="500" cy="630" r="10"/><circle cx="560" cy="630" r="10"/><circle cx="620" cy="630" r="10"/>
  </g>
